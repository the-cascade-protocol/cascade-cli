name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # cascade-cli goes in a subdirectory so the conformance and spec repos can
      # sit next to it. The C-CDA and genomics test suites read fixtures from a
      # sibling `conformance` checkout, and the CAP advisory suites read their
      # example patches from a sibling `spec` checkout (matching the local dev
      # layout), so all three repos must live side by side inside the workspace.
      - name: Checkout cascade-cli
        uses: actions/checkout@v4
        with:
          path: cascade-cli

      - name: Checkout conformance fixtures
        uses: actions/checkout@v4
        with:
          repository: the-cascade-protocol/conformance
          path: conformance

      # The CAP advisory suites read ontologies/advisory/v1-draft/examples/*.ldpatch
      # from here (tests/helpers/spec.ts). Default branch, like the
      # vendored-shapes job below.
      - name: Checkout spec
        uses: actions/checkout@v4
        with:
          repository: the-cascade-protocol/spec
          path: spec

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cascade-cli/package-lock.json

      # The five *-conformance suites canonicalize Turtle through Apache Jena's
      # `riot` (execFileSync) for byte-equal comparison, so it must be on PATH.
      - name: Set up Java (Apache Jena runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Apache Jena (riot)
        run: |
          set -euo pipefail
          JENA_VERSION=5.6.0
          curl -fsSL "https://archive.apache.org/dist/jena/binaries/apache-jena-${JENA_VERSION}.tar.gz" -o "${RUNNER_TEMP}/jena.tar.gz"
          tar -xzf "${RUNNER_TEMP}/jena.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-jena-${JENA_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Verify riot is available
        run: riot --version

      - name: Install dependencies
        working-directory: cascade-cli
        run: npm ci

      - name: Build
        working-directory: cascade-cli
        run: npm run build

      # pipefail is load-bearing: without it the pipeline's status is tee's, so a
      # failing suite would report success.
      - name: Test
        working-directory: cascade-cli
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "${RUNNER_TEMP}/test-output.txt"

      # Green is not the same as complete. A test guarded by describe.skipIf
      # vanishes rather than fails, so a passing run can hide an entire suite
      # that stopped executing.
      #
      # The expected count is zero. The last 24 were the CAP advisory suites,
      # whose two *.ldpatch example files were committed to no repository; they
      # now live in spec, which this workflow checks out. The reference-pod
      # half (40) closed earlier: the pod lives in conformance.
      #
      # This is a ratchet, not a tolerance. It fails in BOTH directions: growth
      # means something stopped running, and a decrease means the gap closed and
      # the baseline must be lowered in the same change, so the number cannot
      # decay into a rubber stamp.
      - name: Fail if the skip count moved
        env:
          EXPECTED_SKIPPED_TESTS: '0'
        run: |
          set -euo pipefail
          # vitest colorizes, so the summary line starts with an ANSI escape, not
          # whitespace. Strip escapes before matching: anchoring on ^[[:space:]]*
          # against raw output silently matches nothing and reports the result as
          # unreadable.
          clean="$(sed 's/\x1b\[[0-9;]*m//g' "${RUNNER_TEMP}/test-output.txt")"
          summary="$(printf '%s\n' "${clean}" | grep -aE '^[[:space:]]*Tests[[:space:]]+[0-9]+ passed' | tail -1 || true)"
          if [ -z "${summary}" ]; then
            echo "::error::Could not find the vitest summary line; refusing to treat an unreadable test result as a pass."
            exit 1
          fi
          echo "summary: ${summary}"
          skipped="$(printf '%s' "${summary}" | sed -n 's/.*[^0-9]\([0-9][0-9]*\) skipped.*/\1/p')"
          [ -n "${skipped}" ] || skipped=0
          echo "skipped=${skipped} expected=${EXPECTED_SKIPPED_TESTS}"
          if [ "${skipped}" -gt "${EXPECTED_SKIPPED_TESTS}" ]; then
            echo "::error::${skipped} tests skipped, expected ${EXPECTED_SKIPPED_TESTS}. Something stopped running."
            exit 1
          fi
          if [ "${skipped}" -lt "${EXPECTED_SKIPPED_TESTS}" ]; then
            echo "::error::Only ${skipped} tests skipped, expected ${EXPECTED_SKIPPED_TESTS}. Good news: lower EXPECTED_SKIPPED_TESTS here in the same change that closed the gap."
            exit 1
          fi

  # Drift between this repository's vendored `src/shapes/` and the `spec` those
  # files were copied from was, until 2026-08-20, checked by nothing at all. A
  # correction to `genomics.shapes.ttl` sat unshipped here for roughly three
  # weeks, and the copy in the published package told two conformant SHACL
  # validators different things about the same star allele.
  #
  # This job is deliberately its own job rather than a step of `test`: it needs a
  # second repository checked out, and a red here means "spec moved and this
  # repository has not caught up", which is a different fact from a failing test
  # and should read as one.
  #
  # `spec` is checked out at the default branch on purpose. Pinning a commit here
  # would make the job deterministic and useless: it would go green against a
  # `spec` that had moved on, which is precisely the failure being fixed. If this
  # job is red on a PR that did not touch shapes, the correct response is to run
  # the sync, not to relax the gate.
  vendored-shapes:
    name: Vendored shapes match spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cascade-cli
        uses: actions/checkout@v4
        with:
          path: cascade-cli

      - name: Checkout spec
        uses: actions/checkout@v4
        with:
          repository: the-cascade-protocol/spec
          path: spec

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cascade-cli/package-lock.json

      # The checker parses both copies of every file, so it needs n3. Nothing
      # else is built or run here.
      - name: Install dependencies
        working-directory: cascade-cli
        run: npm ci

      # Exit 2 (cannot check) is as fatal as exit 1 (drift). A checker that
      # cannot see spec must not report "no drift".
      - name: Check vendored shapes against spec
        working-directory: cascade-cli
        run: node scripts/check-shapes-drift.mjs --spec ../spec
